name: Deploy download page

# Redeploys the download page when only the page changed (release-apk.yml
# ignores these paths), so a new look does not cost a release and a push
# notification. The page is built for the newest release, and the live
# version.json is carried over untouched: it belongs to that release.
on:
  push:
    branches: [main]
    paths:
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site for the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          PUBLISHED=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
          # The release's versioned APK (car-expenses_1.12.3.apk); a release
          # from before that naming has only car-expenses.apk.
          APK_URL=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q \
            '([.assets[] | select(.name | test("_[0-9.]+\\.apk$"))] + [.assets[] | select(.name | endswith(".apk"))])[0].url')
          pip install --quiet qrcode
          VERSION="${TAG#v}" \
          DATE="$(date -u -d "$PUBLISHED" +%Y-%m-%d)" \
          DOWNLOAD_URL="$APK_URL" \
            bash .github/pages/build.sh
          curl -fsS "${{ steps.pages.outputs.base_url }}/version.json" -o _site/version.json

      # Named per attempt and waited for, as in release-apk.yml: the run's
      # artifact list can lag the upload, and deploy-pages reads it once and
      # accepts neither none nor two.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site

      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 30); do
            COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq .total_count || true)
            [ "$COUNT" = 1 ] && exit 0
            sleep 2
          done
          echo "::error::$PAGES_ARTIFACT never showed up in the run's artifact list"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
